<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>happy Saint Valentin BéBé</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep:       oklch(8% 0.01 60);
      --bg-surface:    oklch(13% 0.015 60);
      --bg-overlay:    oklch(10% 0.012 60 / 0.85);
      --text-primary:  oklch(88% 0.02 75);
      --text-muted:    oklch(48% 0.03 60);
      --text-faint:    oklch(32% 0.02 60);
      --accent:        oklch(72% 0.13 55);
      --accent-dim:    oklch(72% 0.13 55 / 0.35);
      --accent-text:   oklch(18% 0.01 55);
      --danger:        oklch(55% 0.18 25);
      --photo-frame:   oklch(92% 0.01 75);
      --border-subtle: oklch(100% 0 0 / 0.08);
      --border-dim:    oklch(100% 0 0 / 0.15);
      --radius-card:   16px;
      --radius-btn:    12px;
      --radius-pill:   9999px;
      --ease-out:      cubic-bezier(0.22, 1, 0.36, 1);
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: var(--bg-deep);
      font-family: 'Fredoka', sans-serif;
      color: var(--text-primary);
    }

    input::placeholder { color: var(--text-faint); }

    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-12px); }
      40%       { transform: translateX(10px); }
      60%       { transform: translateX(-8px); }
      80%       { transform: translateX(6px); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 3px; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
